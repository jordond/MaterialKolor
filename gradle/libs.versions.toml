[versions]
######## Variables ##########
sdk-compile = "37"
sdk-min-library = "21"
sdk-min-app = "26"
jvmTarget = "17"
############################
agp = "9.4.1"
kotlin = "2.4.20"
mcu-psi = "2.4.20"
compose-multiplatform = "1.12.1"
compose-material3 = "1.12.0-alpha03"
androidx-annotation = "1.10.0"
androidx-material3 = "1.5.0-alpha28"
dokka = "2.2.0"
publish = "0.37.0"
colormath = "3.7.0"
composeUnstyled = "2.10.0"
lucide = "1.1.0"
fluent = "v0.1.0"
haze = "1.7.3"
materialIconsExtended = "1.7.3"
poko = "0.23.2"
errorProneAnnotations = "2.50.0"
kotest = "6.2.5"
ktlint = "1.8.0"
spotless = "8.10.2"
androidx-lifecycle = "2.11.0"
compose-hot-reload = "1.2.0"
kotlinx-coroutines = "1.11.0"
kotlinx-collections = "0.5.2"
kotlinx-serialization = "1.11.0"
kotlinxBrowser = "0.5.0"
kmpalette = "4.0.0"
kstore = "1.1.0"
kermit = "2.2.0"
stateHolder = "3.1.0"
buildKonfig = "0.23.0"

# Builder v2
builder-version = "2.0.0"
materialKolorExport = "6.0.0"
metro = "1.4.4"
filekit = "0.16.0"

[libraries]
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish" }
gradlePlugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
mcu-psi = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "mcu-psi" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
colormath = { module = "com.github.ajalt.colormath:colormath", version.ref = "colormath" }
errorProneAnnotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorProneAnnotations" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
composeUnstyled-theming = { module = "com.composables:composeunstyled-theming", version.ref = "composeUnstyled" }
composeUnstyled = { module = "com.composables:composeunstyled", version.ref = "composeUnstyled" }
lucide = { module = "com.composables:icons-lucide", version.ref = "lucide" }
fluent = { module = "io.github.compose-fluent:fluent", version.ref = "fluent" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
kstore = { module = "io.github.xxfast:kstore", version.ref = "kstore" }
kstore-file = { module = "io.github.xxfast:kstore-file", version.ref = "kstore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kmpalette-core = { module = "com.materialkolor.palette:core", version.ref = "kmpalette" }
stateHolder = { module = "dev.jordond.stateholder:core", version.ref = "stateHolder" }
stateHolder-viewModel = { module = "dev.jordond.stateholder:extensions-viewmodel", version.ref = "stateHolder" }
stateHolder-compose = { module = "dev.jordond.stateholder:extensions-compose", version.ref = "stateHolder" }
stateHolder-dispatcher = { module = "dev.jordond.stateholder:dispatcher", version.ref = "stateHolder" }
stateHolder-dispatcher-compose = { module = "dev.jordond.stateholder:dispatcher-compose", version.ref = "stateHolder" }

# Builder v2
gradlePlugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
gradlePlugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
metrox-viewmodel = { module = "dev.zacsweers.metro:metrox-viewmodel", version.ref = "metro" }
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[bundles]
logic-plugins = [
    "gradlePlugin-android",
    "gradlePlugin-kotlin",
    "gradlePlugin-publish",
    "gradlePlugin-spotless",
    "gradlePlugin-compose",
    "gradlePlugin-composeCompiler",
    "gradlePlugin-serialization",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
multiplatform-android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
spotless = {id = "com.diffplug.spotless", version.ref = "spotless"}
buildKonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }

# Builder v2
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
