name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - preview
      - next
    paths-ignore:
      - '**.md'
      - 'builder/**'
  pull_request:
    branches:
      - main
      - next
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - 'art/**'
      - '**.md'
      - 'builder/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: "Detect engine changes"
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      # Pull requests need history back to their base to list the changed files.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect engine and build machinery changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/detect-engine-changes --github-output "$GITHUB_OUTPUT"

  verify-linux:
    name: "Verify ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: JVM
            task: verifyMcuJvm
          - platform: Web
            task: verifyMcuWeb
          - platform: Android
            task: verifyMcuAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the CI and upstream scripts with local fixtures
        if: matrix.platform == 'JVM'
        run: python3 -B -m unittest discover -s .github/tests -v

      - name: Check API and handwritten source formatting
        if: matrix.platform == 'JVM'
        run: ./gradlew checkKotlinAbi spotlessCheck :mcu-source-transformer:test :mcu-source-transformer:testAlternateParser --scan

      - name: Verify ${{ matrix.platform }}
        run: ./gradlew verifyMcuUpstream ${{ matrix.task }} --scan

  verify-apple:
    name: "Verify Apple"
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify Apple targets
        run: ./gradlew verifyMcuUpstream verifyMcuApple --scan

  verify-publication:
    name: "Verify publication"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify local publication and documentation
        run: ./gradlew verifyMcuUpstream verifyMcuPublication --scan
