name: Builder

on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record the screenshot baselines and upload them as an artifact instead of verifying'
        type: boolean
        default: false
  push:
    branches:
      - main
      - next
    # A builder/<version> tag deploys materialkolor.com. Tags skip the paths filter below.
    tags:
      - 'builder/*'
    paths:
      - 'builder/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'
  pull_request:
    branches:
      - main
      - next
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'builder/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Tags build against the published MaterialKolor at materialKolorExport, everything else against this checkout.
env:
  GRADLE_OPTS: ${{ startsWith(github.ref, 'refs/tags/builder/') && '-Dorg.gradle.project.materialkolor.useLocal=false' || '' }}

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: >-
          ./gradlew
          :builder:domain:jvmTest :builder:domain:wasmJsNodeTest
          :builder:codegen:jvmTest :builder:codegen:wasmJsNodeTest
          :builder:engine:jvmTest

      - name: Lint
        run: >-
          ./gradlew
          :builder:domain:spotlessCheck :builder:codegen:spotlessCheck :builder:engine:spotlessCheck
          :builder:kit:spotlessCheck :builder:preview:spotlessCheck :builder:app:spotlessCheck
          :builder:web:spotlessCheck

  compile-check:
    name: "Compile check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the fixtures
        run: ./gradlew :builder:codegen:writeCompileFixtures

      - name: Compile every case on JVM and Android
        run: ./gradlew -p builder/codegen-check compileKotlinJvm compileAndroidMain

      - name: Compile one case per target on wasm
        run: ./gradlew -p builder/codegen-check compileKotlinWasmJs

  site:
    name: "Site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/e2e/package-lock.json

      - name: Assemble the site and check its budget
        run: ./gradlew :builder:web:assembleSite :builder:web:checkBudget

      - name: Upload the site for the Worker tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: builder/web/build/site
          if-no-files-found: error

      - name: Install Playwright
        working-directory: builder/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # b-503
          # boot.spec.ts boots a theme link from wrangler dev, the one server that writes its meta.
          npm --prefix ../worker ci

      - name: Browser tests
        working-directory: builder/e2e
        run: npm test -- --project chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: builder/e2e/playwright-report
          if-no-files-found: ignore

  worker:
    name: "Worker"
    needs: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: builder/web/build/site

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Worker tests
        working-directory: builder/worker
        run: |
          npm ci
          npm run typecheck
          npm test

  screenshots:
    name: "Screenshots"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Screenshots
        env:
          RECORD: ${{ inputs.record }}
        run: |
          tasks=()
          for module in kit preview app; do
            if [ "$RECORD" = "true" ]; then
              tasks+=(":builder:$module:recordRoborazziJvm")
            elif find "builder/$module/src/jvmTest/screenshots" -name '*.png' 2>/dev/null | grep -q .; then
              tasks+=(":builder:$module:verifyRoborazziJvm")
            else
              echo "builder/$module has no committed baselines yet, so it is compared instead of verified."
              tasks+=(":builder:$module:compareRoborazziJvm")
            fi
          done
          ./gradlew "${tasks[@]}"

      - name: Upload the recorded screenshots
        if: inputs.record
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: builder/*/src/jvmTest/screenshots/**/*.png
          if-no-files-found: error

      - name: Upload the screenshot comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-comparison
          path: builder/*/build/outputs/roborazzi
          if-no-files-found: ignore

  preview:
    name: "Preview"
    needs: [ site, worker ]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the staging site
        run: ./gradlew :builder:web:assembleSite -Psite.env=staging

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Upload a preview version
        id: upload
        working-directory: builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci
          npx wrangler versions upload --env staging \
            --preview-alias "pr-$PR" --tag "pr-$PR" --message "Pull request #$PR at ${SHA:0:7}"
          version=$(jq -r 'select(.type == "version-upload") | .preview_url // ""' "$WRANGLER_OUTPUT_FILE_PATH")
          alias=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // ""' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$version" ]; then
            echo "::error title=No preview URL::wrangler gave no preview URL. Preview URLs come on with the first staging deploy, so run the Builder workflow by hand on next once, and check that the account has a workers.dev subdomain."
            exit 1
          fi
          # The alias always serves the latest push, the version URL stays on this commit.
          echo "url=${alias:-$version}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: builder-preview
          message: |
            ### ✅ Builder preview deployed

            | | |
            | --- | --- |
            | **URL** | ${{ steps.upload.outputs.url }} |
            | **This commit** | ${{ steps.upload.outputs.version }} |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |

            Built as the staging site, so its share links and link cards point at staging.materialkolor.com.

            _Updates on every push to this pull request._

      - name: Comment the preview failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: builder-preview
          message: |
            ### ❌ Builder preview failed

            | | |
            | --- | --- |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |
            | **Logs** | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            The preview URL, if any, still points at an older commit.

  staging:
    name: "Staging"
    needs: [ test, compile-check, site, worker, screenshots ]
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.record))
      && (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/feat/builder-v2')
    runs-on: ubuntu-latest
    concurrency:
      group: builder-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the staging site
        env: { CF_WEB_ANALYTICS_TOKEN: "${{ vars.CF_WEB_ANALYTICS_TOKEN }}" }
        run: ./gradlew :builder:web:assembleSite -Psite.env=staging

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Deploy staging
        working-directory: builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref_name }}
        run: |
          npm ci
          npx wrangler deploy --env staging --message "$REF at ${GITHUB_SHA:0:7}"

      - name: Check the deployed headers
        run: builder/worker/scripts/check-deploy.sh https://staging.materialkolor.com staging

  release:
    name: "Release check"
    if: startsWith(github.ref, 'refs/tags/builder/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag and the exported version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          catalog() { sed -nE "s/^$1 = \"([^\"]+)\"/\1/p" gradle/libs.versions.toml; }
          builder=$(catalog builder-version)
          exported=$(catalog materialKolorExport)
          if [ "${TAG#builder/}" != "$builder" ]; then
            echo "::error title=Tag does not match::$TAG does not match builder-version $builder in gradle/libs.versions.toml."
            exit 1
          fi
          for module in core material3 palette unstyled fluent; do
            pom="https://repo1.maven.org/maven2/com/materialkolor/material-kolor-$module/$exported/material-kolor-$module-$exported.pom"
            if ! curl -sS --fail -I -o /dev/null "$pom"; then
              echo "::error title=MaterialKolor $exported is not published::$pom is missing. Publish MaterialKolor $exported before the builder that uses it."
              exit 1
            fi
          done

  production:
    name: "Production"
    needs: [ release, test, compile-check, site, worker, screenshots ]
    runs-on: ubuntu-latest
    concurrency:
      group: builder-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the site
        env: { CF_WEB_ANALYTICS_TOKEN: "${{ vars.CF_WEB_ANALYTICS_TOKEN }}" }
        run: ./gradlew :builder:web:assembleSite

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Deploy production
        working-directory: builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          npm ci
          npx wrangler deploy --message "$TAG at ${GITHUB_SHA:0:7}"

      - name: Check the deployed headers
        run: builder/worker/scripts/check-deploy.sh https://materialkolor.com production
