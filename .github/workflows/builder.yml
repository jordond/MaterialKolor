name: Builder

on:
  workflow_dispatch:
    # b-213
    inputs:
      record:
        description: 'Record the screenshot baselines and upload them as an artifact instead of verifying'
        type: boolean
        default: false
  push:
    branches:
      - feat/builder-v2
      - next
    paths:
      - 'builder/**'
      - '!builder/shared/**'
      - '!builder/android/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'
  pull_request:
    branches:
      - feat/builder-v2
      - next
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'builder/**'
      - '!builder/shared/**'
      - '!builder/android/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: >-
          ./gradlew
          :builder:domain:jvmTest :builder:domain:wasmJsNodeTest
          :builder:codegen:jvmTest :builder:codegen:wasmJsNodeTest
          :builder:engine:jvmTest

      # Its own invocation, since the wasm test compile writes to build/ while spotless reads the tree.
      - name: Lint
        run: >-
          ./gradlew
          :builder:domain:spotlessCheck :builder:codegen:spotlessCheck :builder:engine:spotlessCheck
          :builder:kit:spotlessCheck :builder:preview:spotlessCheck :builder:app:spotlessCheck
          :builder:web:spotlessCheck

  compile-check:
    name: "Compile check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the fixtures
        run: ./gradlew :builder:codegen:writeCompileFixtures

      - name: Compile every case on JVM and Android
        run: ./gradlew -p builder/codegen-check compileKotlinJvm compileAndroidMain

      - name: Compile one case per target on wasm
        run: ./gradlew -p builder/codegen-check compileKotlinWasmJs

  # b-213
  site:
    name: "Site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The budget's brotli sizes of record come from this Node.
      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/e2e/package-lock.json

      - name: Assemble the site and check its budget
        run: ./gradlew :builder:web:assembleSite :builder:web:checkBudget

      # b-502
      - name: Upload the site for the Worker tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: builder/web/build/site
          if-no-files-found: error

      - name: Install Playwright
        working-directory: builder/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # b-503
          # boot.spec.ts boots a theme link from wrangler dev, the one server that writes its meta.
          npm --prefix ../worker ci

      - name: Browser tests
        working-directory: builder/e2e
        run: npm test -- --project chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: builder/e2e/playwright-report
          if-no-files-found: ignore

  # b-502
  # The Worker's tests run in workerd against the site the Site job assembled. No deploy, no
  # secrets, nothing that could ask for a Cloudflare login.
  worker:
    name: "Worker"
    needs: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: builder/web/build/site

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Worker tests
        working-directory: builder/worker
        run: |
          npm ci
          npm run typecheck
          npm test

  # Screenshot baselines come only from this job. Run it by hand with `record` to get them as an
  # artifact to commit. A module with no committed baselines yet is compared rather than verified,
  # since verifying fails on a missing baseline. Once a module has one baseline it is verified, so
  # a new screenshot test in it fails verify until someone dispatches `record` on that branch and
  # commits the PNGs it uploads.
  screenshots:
    name: "Screenshots"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Screenshots
        env:
          RECORD: ${{ inputs.record }}
        run: |
          tasks=()
          for module in kit preview app; do
            if [ "$RECORD" = "true" ]; then
              tasks+=(":builder:$module:recordRoborazziJvm")
            elif find "builder/$module/src/jvmTest/screenshots" -name '*.png' 2>/dev/null | grep -q .; then
              tasks+=(":builder:$module:verifyRoborazziJvm")
            else
              echo "builder/$module has no committed baselines yet, so it is compared instead of verified."
              tasks+=(":builder:$module:compareRoborazziJvm")
            fi
          done
          ./gradlew "${tasks[@]}"

      - name: Upload the recorded screenshots
        if: inputs.record
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: builder/*/src/jvmTest/screenshots/**/*.png
          if-no-files-found: error

      - name: Upload the screenshot comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-comparison
          path: builder/*/build/outputs/roborazzi
          if-no-files-found: ignore

  # b-505
  # Whether the Cloudflare secrets are set. Until the owner adds CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID, Preview and Staging skip instead of failing. A job's `if` cannot read
  # secrets, so this job reads them and hands on the answer.
  cloudflare:
    name: "Cloudflare secrets"
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No Cloudflare secrets::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so Preview and Staging skip."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # b-505
  # A version of the staging Worker for each pull request from this repository, built as the staging
  # site, and a comment on the pull request with its preview URL. Uploading a version deploys nothing,
  # so staging keeps serving what it served. Pull requests from forks get no secrets and skip.
  preview:
    name: "Preview"
    needs: [ cloudflare, site, worker ]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.cloudflare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the staging site
        run: ./gradlew :builder:web:assembleSite -Psite.env=staging

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Upload a preview version
        id: upload
        working-directory: builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci
          npx wrangler versions upload --env staging \
            --preview-alias "pr-$PR" --tag "pr-$PR" --message "Pull request #$PR at ${SHA:0:7}"
          jq -r 'select(.type == "version-upload") | "url=\(.preview_url // "")", "alias=\(.preview_alias_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      # One comment per pull request, edited on each push.
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          ALIAS_URL: ${{ steps.upload.outputs.alias }}
        run: |
          set -o pipefail
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error title=No preview URL::wrangler gave no preview URL. Preview URLs come on with the first staging deploy, so run the Builder workflow by hand on feat/builder-v2 once, and check that the account has a workers.dev subdomain."
            exit 1
          fi
          marker='<!-- builder-preview -->'
          body=$(printf '%s\n%s' "$marker" "**Builder preview** of ${SHA:0:7}, built as the staging site: $PREVIEW_URL")
          if [ -n "$ALIAS_URL" ]; then
            body=$(printf '%s\n\n%s' "$body" "The latest push of this pull request is always at $ALIAS_URL")
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # b-505
  # Deploys staging.materialkolor.com, the only home of the new builder until 6.0 is stable, from a
  # push to next or feat/builder-v2 or a run by hand, once every other job passed. Production keeps
  # the old builder until the cutover (B-506), and nothing here deploys it. Never on a builder/* tag,
  # which would also run the old builder-release.yml.
  staging:
    name: "Staging"
    needs: [ cloudflare, test, compile-check, site, worker, screenshots ]
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.record))
      && (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/feat/builder-v2')
      && needs.cloudflare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time across both branches, and never cut off halfway.
    concurrency:
      group: builder-staging
      cancel-in-progress: false
    env:
      STAGING_ORIGIN: https://staging.materialkolor.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the staging site
        run: ./gradlew :builder:web:assembleSite -Psite.env=staging

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Deploy staging
        working-directory: builder/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref_name }}
        run: |
          npm ci
          npx wrangler deploy --env staging --message "$REF at ${GITHUB_SHA:0:7}"

      # V-07. The wasm has to reach browsers brotli-compressed and cached for good. A GET rather
      # than a HEAD, since the edge only compresses a response that has a body. The first request
      # to a new custom domain can fail while its certificate is issued, so each one retries.
      - name: Check the deployed headers
        run: |
          set -o pipefail
          fetch() {
            curl -sS --fail --retry 6 --retry-delay 20 --retry-all-errors -o /dev/null -D - \
              -H 'Accept-Encoding: br' "$1" | tr -d '\r'
          }
          failed=0
          for wasm in builder/web/build/site/assets/*.wasm; do
            url="$STAGING_ORIGIN/assets/$(basename "$wasm")"
            if ! headers=$(fetch "$url"); then
              echo "::error title=Staging unreachable::$url did not answer. Check the staging.materialkolor.com custom domain of the Worker materialkolor-builder-staging."
              exit 1
            fi
            echo "$url"
            echo "$headers"
            if ! grep -qix 'content-encoding: br' <<< "$headers"; then
              echo "::error title=Wasm not brotli-compressed::$url came back without content-encoding br. Check that the materialkolor.com zone compresses application/wasm with brotli, under Rules, Compression Rules."
              failed=1
            fi
            if ! grep -qix 'cache-control: public, max-age=31536000, immutable' <<< "$headers"; then
              echo "::error title=Wasm not immutable::$url came back without the immutable Cache-Control. Check the /assets/* rule in the _headers that writeHeaders writes."
              failed=1
            fi
          done
          # The page comes from the site's _headers and a theme page from the Worker.
          for path in / /t/AdllOwAAAAAT; do
            if ! headers=$(fetch "$STAGING_ORIGIN$path"); then
              echo "::error title=Staging unreachable::$STAGING_ORIGIN$path did not answer."
              exit 1
            fi
            if ! grep -qix 'x-robots-tag: noindex' <<< "$headers"; then
              echo "::error title=Staging is indexable::$STAGING_ORIGIN$path came back without X-Robots-Tag noindex. Check the staging _headers and ROBOTS_TAG in wrangler.jsonc."
              failed=1
            fi
          done
          exit "$failed"
