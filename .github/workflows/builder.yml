name: Builder

on:
  workflow_dispatch:
    # b-213
    inputs:
      record:
        description: 'Record the screenshot baselines and upload them as an artifact instead of verifying'
        type: boolean
        default: false
  push:
    branches:
      - feat/builder-v2
      - next
    paths:
      - 'builder/**'
      - '!builder/shared/**'
      - '!builder/android/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'
  pull_request:
    branches:
      - feat/builder-v2
      - next
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'builder/**'
      - '!builder/shared/**'
      - '!builder/android/**'
      - 'material-kolor-core/**'
      - 'material-kolor-material3/**'
      - 'material-kolor-unstyled/**'
      - 'material-kolor-fluent/**'
      - 'material-kolor-palette/**'
      - 'material-color-utilities/**'
      - 'tools/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/builder.yml'

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: >-
          ./gradlew
          :builder:domain:jvmTest :builder:domain:wasmJsNodeTest
          :builder:codegen:jvmTest :builder:codegen:wasmJsNodeTest
          :builder:engine:jvmTest

      # Its own invocation, since the wasm test compile writes to build/ while spotless reads the tree.
      - name: Lint
        run: >-
          ./gradlew
          :builder:domain:spotlessCheck :builder:codegen:spotlessCheck :builder:engine:spotlessCheck
          :builder:kit:spotlessCheck :builder:preview:spotlessCheck :builder:app:spotlessCheck
          :builder:web:spotlessCheck

  compile-check:
    name: "Compile check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the fixtures
        run: ./gradlew :builder:codegen:writeCompileFixtures

      - name: Compile every case on JVM and Android
        run: ./gradlew -p builder/codegen-check compileKotlinJvm compileAndroidMain

      - name: Compile one case per target on wasm
        run: ./gradlew -p builder/codegen-check compileKotlinWasmJs

  # b-213
  site:
    name: "Site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The budget's brotli sizes of record come from this Node.
      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/e2e/package-lock.json

      - name: Assemble the site and check its budget
        run: ./gradlew :builder:web:assembleSite :builder:web:checkBudget

      # b-502
      - name: Upload the site for the Worker tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: builder/web/build/site
          if-no-files-found: error

      - name: Install Playwright
        working-directory: builder/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: builder/e2e
        run: npm test -- --project chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: builder/e2e/playwright-report
          if-no-files-found: ignore

  # b-502
  # The Worker's tests run in workerd against the site the Site job assembled. No deploy, no
  # secrets, nothing that could ask for a Cloudflare login.
  worker:
    name: "Worker"
    needs: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: builder/web/build/site

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/worker/package-lock.json

      - name: Worker tests
        working-directory: builder/worker
        run: |
          npm ci
          npm run typecheck
          npm test

  # Screenshot baselines come only from this job. Run it by hand with `record` to get them as an
  # artifact to commit. A module with no committed baselines yet is compared rather than verified,
  # since verifying fails on a missing baseline. Once a module has one baseline it is verified, so
  # a new screenshot test in it fails verify until someone dispatches `record` on that branch and
  # commits the PNGs it uploads.
  screenshots:
    name: "Screenshots"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Screenshots
        env:
          RECORD: ${{ inputs.record }}
        run: |
          tasks=()
          for module in kit preview app; do
            if [ "$RECORD" = "true" ]; then
              tasks+=(":builder:$module:recordRoborazziJvm")
            elif find "builder/$module/src/jvmTest/screenshots" -name '*.png' 2>/dev/null | grep -q .; then
              tasks+=(":builder:$module:verifyRoborazziJvm")
            else
              echo "builder/$module has no committed baselines yet, so it is compared instead of verified."
              tasks+=(":builder:$module:compareRoborazziJvm")
            fi
          done
          ./gradlew "${tasks[@]}"

      - name: Upload the recorded screenshots
        if: inputs.record
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: builder/*/src/jvmTest/screenshots/**/*.png
          if-no-files-found: error

      - name: Upload the screenshot comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-comparison
          path: builder/*/build/outputs/roborazzi
          if-no-files-found: ignore
