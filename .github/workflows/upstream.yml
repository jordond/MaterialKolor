name: Upstream changes

on:
  # Scheduled runs only fire from the default branch, so the daily run starts once 6.0 lands on
  # main. Until then run it by hand with `gh workflow run upstream.yml --ref next`.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # A pin change on next can leave the open bump pull request stale or already merged.
  push:
    branches:
      - next
    paths:
      - tools/mcu-upstream/src/main

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: read

# When 6.0 lands on main, point BASE_BRANCH at main and drop the stopped schedule there.
env:
  BASE_BRANCH: next
  BUMP_BRANCH: upstream/mcu
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  bump:
    name: "Update the upstream pin"
    if: github.repository == 'jordond/MaterialKolor'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger CI or Builder, so a fine-grained
      # token with contents, pull requests and issues write access opens them instead. Only the
      # steps that talk to GitHub see it, never the Gradle steps that run upstream code.
      - name: Require the bot token
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add an UPSTREAM_BOT_TOKEN repository secret with contents, pull requests and issues write access."
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream for Kotlin changes
        id: check
        run: ./.github/check-upstream --github-output "$GITHUB_OUTPUT" --summary "$RUNNER_TEMP/upstream-commits.md"

      - name: Plan the pull request
        id: plan
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET: ${{ steps.check.outputs.target }}
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
          RELEVANT: ${{ steps.check.outputs.relevant }}
        run: ./.github/plan-upstream --github-output "$GITHUB_OUTPUT"

      - name: Close the caught-up pull request
        if: steps.plan.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          NUMBER: ${{ steps.plan.outputs.number }}
          DELETE_BRANCH: ${{ steps.plan.outputs.delete_branch }}
        run: |
          if [ "$DELETE_BRANCH" = true ]; then
            gh pr close "$NUMBER" --delete-branch \
              --comment "\`$BASE_BRANCH\` already pins every upstream Kotlin and license change, so this bump is no longer needed."
          else
            gh pr close "$NUMBER" \
              --comment "\`$BASE_BRANCH\` already pins every upstream Kotlin and license change, so this bump is no longer needed. The branch has maintainer commits, so it was kept."
          fi

      - name: Tell the maintainer the bump is stale
        if: steps.plan.outputs.action == 'notify'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          NUMBER: ${{ steps.plan.outputs.number }}
          TARGET: ${{ steps.check.outputs.target }}
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
        run: |
          set -euo pipefail
          marker="<!-- upstream-target:$TARGET base:$CURRENT -->"
          comments=$(gh pr view "$NUMBER" --json comments --jq '.comments[].body')
          if grep -qF "$marker" <<< "$comments"; then
            exit 0
          fi
          gh pr comment "$NUMBER" --body "Upstream is now at \`$TARGET_SHORT\`, or the pin on \`$BASE_BRANCH\` changed. This branch has maintainer commits, so it was not rewritten. Update the pin here by hand, or close this pull request and delete the branch so the next run opens a fresh one.

          $marker"

      - name: Setup Java
        if: steps.plan.outputs.action == 'update'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        if: steps.plan.outputs.action == 'update'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Move the pin and lock
        if: steps.plan.outputs.action == 'update'
        env:
          TARGET: ${{ steps.check.outputs.target }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch --quiet -C "$BUMP_BRANCH"
          git -C tools/mcu-upstream/src/main checkout --quiet --detach "$TARGET"
          ./gradlew candidateMcuUpstreamLock
          # The candidate is pretty-printed with four spaces, the tracked lock with two.
          jq --indent 2 . build/mcu-upstream.lock.candidate.json > gradle/mcu-upstream.lock.json
          git add tools/mcu-upstream/src/main gradle/mcu-upstream.lock.json
          git commit --quiet -m "$TITLE"

      - name: Transform the new sources
        id: transform
        if: steps.plan.outputs.action == 'update'
        continue-on-error: true
        run: ./gradlew :material-color-utilities:generateMcuSources

      # The golden generators compile against the adapted library, so they only run on a clean
      # transform and a transform failure is reported as the cause.
      - name: Regenerate golden fixtures
        id: goldens
        if: steps.plan.outputs.action == 'update' && steps.transform.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
        run: |
          set -euo pipefail
          fixtures=material-color-utilities/src/commonTest/kotlin/com/materialkolor/conformance
          # A cold build prints the transformer summary even under -q, so compile before printing.
          ./gradlew :mcu-upstream:testClasses
          # Written aside first so a failed generator cannot leave a truncated fixture behind.
          ./gradlew -q :mcu-upstream:printMcuRoleGoldens > "$RUNNER_TEMP/UpstreamRoleGoldenData.kt"
          ./gradlew -q :mcu-upstream:printMcuQuantizerGoldens > "$RUNNER_TEMP/UpstreamQuantizerGoldenData.kt"
          mv "$RUNNER_TEMP/UpstreamRoleGoldenData.kt" "$RUNNER_TEMP/UpstreamQuantizerGoldenData.kt" "$fixtures/"
          ./gradlew :material-color-utilities:spotlessApply
          git add "$fixtures"
          git commit --quiet -m "test(mcu): regenerate golden fixtures for upstream $TARGET_SHORT"

      - name: Reset fixtures after a failed regeneration
        if: steps.plan.outputs.action == 'update' && steps.goldens.outcome == 'failure'
        run: git checkout -- material-color-utilities/src/commonTest

      - name: Open or update the pull request
        if: steps.plan.outputs.action == 'update'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          NUMBER: ${{ steps.plan.outputs.number }}
          TITLE: ${{ steps.plan.outputs.title }}
          CURRENT_SHORT: ${{ steps.check.outputs.current_short }}
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
          GOLDENS: ${{ steps.goldens.outcome }}
          TRANSFORM: ${{ steps.transform.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$TRANSFORM" = success ]; then
            transform="The transformer adapted the new sources."
          else
            transform="**The transformer failed on the new sources.** A rule or shape expectation needs updating, see the [workflow run]($RUN_URL)."
          fi
          case "$GOLDENS" in
            success) goldens="Golden fixtures were regenerated from the raw upstream Kotlin in their own commit, so any color change shows up in that diff." ;;
            skipped) goldens="Golden fixtures were not regenerated because the transform failed. Regenerate them once it passes." ;;
            *) goldens="**Golden fixture regeneration failed**, see the [workflow run]($RUN_URL)." ;;
          esac
          body="$RUNNER_TEMP/body.md"
          {
            echo "Moves the material-color-utilities pin from \`$CURRENT_SHORT\` to \`$TARGET_SHORT\`."
            echo
            echo "## Upstream Kotlin and license changes"
            echo
            cat "$RUNNER_TEMP/upstream-commits.md"
            echo
            echo "## Status"
            echo
            echo "- $transform"
            echo "- $goldens"
            echo "- A red \`checkKotlinAbi\` means the public API moved. Review it against docs/upstream-psi.md, then run \`./gradlew updateKotlinAbi\` on macOS and push to this branch. When upstream moves again the bot rewrites the branch and drops those dump commits, so push them again."
          } > "$body"

          # Checkout did not keep credentials, so the push authenticates here. The lease expects the
          # branch exactly as the checkout saw it, or absent when it did not exist yet.
          expected=$(git rev-parse -q --verify "refs/remotes/origin/$BUMP_BRANCH" || true)
          git push --force-with-lease="refs/heads/$BUMP_BRANCH:$expected" \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BUMP_BRANCH"
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title "$TITLE" --body-file "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BUMP_BRANCH" --title "$TITLE" \
              --body-file "$body" --label upstream
          fi
