name: Upstream changes

on:
  # Scheduled runs only fire from the default branch, so the daily run starts once 6.0 lands on
  # main. Until then run it by hand with `gh workflow run upstream.yml --ref next`.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # A pin change on next can leave the open bump pull request stale or already merged.
  push:
    branches:
      - next
    paths:
      - tools/mcu-upstream/src/main

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_BRANCH: next
  BUMP_BRANCH: upstream/mcu
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Pull requests opened with GITHUB_TOKEN do not trigger CI or Builder, so a fine-grained token
  # with contents, pull requests and issues write access opens and updates the bump instead.
  GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}

jobs:
  bump:
    name: "Update the upstream pin"
    runs-on: ubuntu-latest
    steps:
      - name: Require the bot token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add an UPSTREAM_BOT_TOKEN repository secret with contents, pull requests and issues write access."
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_BOT_TOKEN }}

      - name: Check upstream for Kotlin changes
        id: check
        run: ./.github/check-upstream --github-output "$GITHUB_OUTPUT" --summary "$RUNNER_TEMP/upstream-commits.md"

      - name: Plan the pull request
        id: plan
        env:
          TARGET: ${{ steps.check.outputs.target }}
          RELEVANT: ${{ steps.check.outputs.relevant }}
        run: |
          set -euo pipefail
          number=$(gh pr list --base "$BASE_BRANCH" --head "$BUMP_BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          revision=""
          edited=false
          if [ -n "$number" ]; then
            git fetch --quiet origin "$BUMP_BRANCH"
            revision=$(git show "origin/$BUMP_BRANCH:gradle/mcu-upstream.lock.json" | jq -r .upstreamRevision)
            authors=$(git log "origin/$BASE_BRANCH..origin/$BUMP_BRANCH" --format=%ae)
            if grep -qvxF "$BOT_EMAIL" <<< "$authors"; then
              edited=true
            fi
          fi

          if [ "$RELEVANT" = 0 ]; then
            action=$([ -n "$number" ] && echo close || echo none)
          elif [ "$revision" = "$TARGET" ]; then
            action=none
          elif [ "$edited" = true ]; then
            # Rewriting the branch would drop the maintainer's commits, so the bump waits for them.
            action=notify
          else
            action=update
          fi
          echo "Open pull request: ${number:-none}, pinned there: ${revision:-none}, target: $TARGET, action: $action"
          {
            echo "number=$number"
            echo "action=$action"
            echo "short=$(git -C tools/mcu-upstream/src/main rev-parse --short "$TARGET")"
          } >> "$GITHUB_OUTPUT"

      - name: Close the caught-up pull request
        if: steps.plan.outputs.action == 'close'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          gh pr close "$NUMBER" --delete-branch \
            --comment "\`$BASE_BRANCH\` already pins every upstream Kotlin and license change, so this bump is no longer needed."

      - name: Tell the maintainer upstream moved
        if: steps.plan.outputs.action == 'notify'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
          TARGET: ${{ steps.check.outputs.target }}
          SHORT: ${{ steps.plan.outputs.short }}
        run: |
          set -euo pipefail
          marker="<!-- upstream-target:$TARGET -->"
          if gh pr view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            exit 0
          fi
          gh pr comment "$NUMBER" --body "Upstream moved to \`$SHORT\`. This branch has maintainer commits, so it was not rewritten. Update the pin here by hand, or close this pull request and rerun the workflow.

          $marker"

      - name: Setup Java
        if: steps.plan.outputs.action == 'update'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        if: steps.plan.outputs.action == 'update'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Move the pin and lock
        if: steps.plan.outputs.action == 'update'
        env:
          TARGET: ${{ steps.check.outputs.target }}
          SHORT: ${{ steps.plan.outputs.short }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch --quiet -C "$BUMP_BRANCH"
          git -C tools/mcu-upstream/src/main checkout --quiet --detach "$TARGET"
          ./gradlew candidateMcuUpstreamLock
          # The candidate is pretty-printed with four spaces, the tracked lock with two.
          jq --indent 2 . build/mcu-upstream.lock.candidate.json > gradle/mcu-upstream.lock.json
          git add tools/mcu-upstream/src/main gradle/mcu-upstream.lock.json
          git commit --quiet -m "fix(mcu): update upstream pin to $SHORT"

      - name: Regenerate golden fixtures
        id: goldens
        if: steps.plan.outputs.action == 'update'
        continue-on-error: true
        env:
          SHORT: ${{ steps.plan.outputs.short }}
        run: |
          set -euo pipefail
          fixtures=material-color-utilities/src/commonTest/kotlin/com/materialkolor/conformance
          # A cold build prints the transformer summary even under -q, so compile before printing.
          ./gradlew :mcu-upstream:testClasses
          # Written aside first so a failed generator cannot leave a truncated fixture behind.
          ./gradlew -q :mcu-upstream:printMcuRoleGoldens > "$RUNNER_TEMP/UpstreamRoleGoldenData.kt"
          ./gradlew -q :mcu-upstream:printMcuQuantizerGoldens > "$RUNNER_TEMP/UpstreamQuantizerGoldenData.kt"
          mv "$RUNNER_TEMP/UpstreamRoleGoldenData.kt" "$RUNNER_TEMP/UpstreamQuantizerGoldenData.kt" "$fixtures/"
          ./gradlew :material-color-utilities:spotlessApply
          git add "$fixtures"
          git commit --quiet -m "test(mcu): regenerate golden fixtures for upstream $SHORT"

      - name: Reset fixtures after a failed regeneration
        if: steps.plan.outputs.action == 'update' && steps.goldens.outcome == 'failure'
        run: git checkout -- material-color-utilities/src/commonTest

      - name: Transform the new sources
        id: transform
        if: steps.plan.outputs.action == 'update'
        continue-on-error: true
        run: ./gradlew :material-color-utilities:generateMcuSources

      - name: Open or update the pull request
        if: steps.plan.outputs.action == 'update'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
          CURRENT: ${{ steps.check.outputs.current }}
          SHORT: ${{ steps.plan.outputs.short }}
          GOLDENS: ${{ steps.goldens.outcome }}
          TRANSFORM: ${{ steps.transform.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="fix(mcu): update upstream pin to $SHORT"
          if [ "$TRANSFORM" = success ]; then
            transform="The transformer adapted the new sources."
          else
            transform="**The transformer failed on the new sources.** A rule or shape expectation needs updating, see the [workflow run]($RUN_URL)."
          fi
          if [ "$GOLDENS" = success ]; then
            goldens="Golden fixtures were regenerated from the raw upstream Kotlin in their own commit, so any color change shows up in that diff."
          else
            goldens="**Golden fixture regeneration failed**, see the [workflow run]($RUN_URL)."
          fi
          body="$RUNNER_TEMP/body.md"
          {
            echo "Moves the material-color-utilities pin from \`$(git -C tools/mcu-upstream/src/main rev-parse --short "$CURRENT")\` to \`$SHORT\`."
            echo
            echo "## Upstream Kotlin and license changes"
            echo
            cat "$RUNNER_TEMP/upstream-commits.md"
            echo
            echo "## Status"
            echo
            echo "- $transform"
            echo "- $goldens"
            echo "- A red \`checkKotlinAbi\` means the public API moved. Review it against docs/upstream-psi.md, then run \`./gradlew updateKotlinAbi\` on macOS and push to this branch."
          } > "$body"

          git push --force-with-lease origin "HEAD:refs/heads/$BUMP_BRANCH"
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title "$title" --body-file "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BUMP_BRANCH" --title "$title" \
              --body-file "$body" --label upstream
          fi
