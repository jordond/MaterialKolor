name: Upstream changes

on:
  # The 6.0 monitor on next replaces this one, and scheduled runs only fire from the default
  # branch, so the schedule stays off until 6.0 lands here. Keeping workflow_dispatch lets
  # `gh workflow run upstream.yml --ref next` run the next version by hand.
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    name: "Check upstream for changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check for upstream changes
        run: ./.github/check-upstream --token ${{ secrets.GITHUB_TOKEN }}
