name: Upstream changes

on:
  # Scheduled runs only fire from the default branch, so the daily run starts once 6.0 lands on
  # main. Until then run it by hand with `gh workflow run upstream.yml --ref next`.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # A pin change on the base branch can leave the open bump pull request stale or already merged.
  push:
    branches:
      - next
    paths:
      - tools/mcu-upstream/src/main

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: read

# When 6.0 lands on main, set BASE_BRANCH and the push branch above to main, and drop the stopped
# schedule and the `--ref next` hint.
env:
  BASE_BRANCH: next
  BUMP_BRANCH: upstream/mcu
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  # Fails in seconds instead of after the build when the token is missing.
  preflight:
    name: "Check the bot token"
    if: github.repository == 'jordond/MaterialKolor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the bot token
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: '[ -n "$GH_TOKEN" ] || { echo "::error::Add an UPSTREAM_BOT_TOKEN repository secret with contents, pull requests and issues write access."; exit 1; }'

  # Runs upstream code through Gradle, so it holds no write token.
  prepare:
    name: "Prepare the upstream bump"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      number: ${{ steps.plan.outputs.number }}
      delete_branch: ${{ steps.plan.outputs.delete_branch }}
      title: ${{ steps.plan.outputs.title }}
      expected: ${{ steps.plan.outputs.expected }}
      current: ${{ steps.check.outputs.current }}
      current_short: ${{ steps.check.outputs.current_short }}
      target: ${{ steps.check.outputs.target }}
      target_short: ${{ steps.check.outputs.target_short }}
      base: ${{ steps.plan.outputs.base }}
      transform: ${{ steps.bump.outputs.transform }}
      goldens: ${{ steps.bump.outputs.goldens }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream for Kotlin changes
        id: check
        run: ./.github/scripts/check-upstream --github-output "$GITHUB_OUTPUT" --summary "$RUNNER_TEMP/bump/upstream-commits.md"

      - name: Plan the pull request
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          TARGET: ${{ steps.check.outputs.target }}
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
          RELEVANT: ${{ steps.check.outputs.relevant }}
        run: ./.github/scripts/plan-upstream --github-output "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.plan.outputs.action == 'update'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        if: steps.plan.outputs.action == 'update'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Move the pin, transform and regenerate fixtures
        id: bump
        if: steps.plan.outputs.action == 'update'
        env:
          TARGET: ${{ steps.check.outputs.target }}
          TARGET_SHORT: ${{ steps.check.outputs.target_short }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: ./.github/scripts/bump-upstream --github-output "$GITHUB_OUTPUT" --bundle "$RUNNER_TEMP/bump/bump.bundle"

      - name: Upload the bump
        if: steps.plan.outputs.action == 'update'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-bump
          path: ${{ runner.temp }}/bump/
          retention-days: 1
          if-no-files-found: error

  # Holds the write token in a fresh checkout that never ran upstream code. Pull requests opened
  # with GITHUB_TOKEN do not trigger CI or Builder, hence the fine-grained token.
  publish:
    name: "Publish the upstream bump"
    needs: prepare
    if: needs.prepare.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base || env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the bump
        if: needs.prepare.outputs.action == 'update'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-bump
          path: ${{ runner.temp }}/bump

      - name: Update the pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          ACTION: ${{ needs.prepare.outputs.action }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          DELETE_BRANCH: ${{ needs.prepare.outputs.delete_branch }}
          TITLE: ${{ needs.prepare.outputs.title }}
          EXPECTED: ${{ needs.prepare.outputs.expected }}
          CURRENT: ${{ needs.prepare.outputs.current }}
          CURRENT_SHORT: ${{ needs.prepare.outputs.current_short }}
          TARGET: ${{ needs.prepare.outputs.target }}
          TARGET_SHORT: ${{ needs.prepare.outputs.target_short }}
          TRANSFORM: ${{ needs.prepare.outputs.transform }}
          GOLDENS: ${{ needs.prepare.outputs.goldens }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./.github/scripts/publish-upstream \
            --bundle "$RUNNER_TEMP/bump/bump.bundle" --summary "$RUNNER_TEMP/bump/upstream-commits.md"
